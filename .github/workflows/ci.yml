name: CI

on:
  push:
  pull_request:

jobs:
  ui-ux-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run search regression tests
        run: python -m unittest discover -s skills/ui-ux-pro-max/tests -v
